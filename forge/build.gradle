plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "bendygeckocompat.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    maven { url "https://maven.kosmx.dev/" }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    modCompileOnly modLocalRuntime("io.github.kosmx.bendy-lib:bendy-lib-forge:4.0.0")
    modCompileOnly modLocalRuntime("software.bernie.geckolib:geckolib-forge-1.20.1:4.4.4")
    forgeRuntimeLibrary "com.eliotlash.mclib:mclib:20"
    implementation "com.eliotlash.mclib:mclib:20"

    modLocalRuntime "dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20"
    modLocalRuntime "maven.modrinth:emotecraft:2.2.7-b.build.50+1.20.1-forge"

    modLocalRuntime "maven.modrinth:curios:5.14.1+1.20.1"
    modLocalRuntime "maven.modrinth:smartbrainlib:1.15"
    modLocalRuntime "maven.modrinth:dungeons-and-combat:1.2.2"
    modLocalRuntime "maven.modrinth:survival-instinct:1.0.2"
    modLocalRuntime "maven.modrinth:arc-raiders:1.1.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        if (System.getenv("MAVEN_PASS") != null) {
            maven {
                url = 'https://maven.kosmx.dev/'
                credentials {
                    username = project.keys.maven_user
                    password = project.keys.kosmx_maven
                }
            }
        } else {
            mavenLocal()
        }


        if(System.getenv("GITHUB_ACTOR") != null) {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/Tatou8/BendyGeckoCompat"
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
